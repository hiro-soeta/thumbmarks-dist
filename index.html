<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>サムネブックマーク</title>
<style>
:root{--bg:#EEF0EC;--fg:#1C2220;--muted:#68726E;--accent:#1F6B57;--accent-fg:#fff;--line:#D6DBD7;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141917;--fg:#E8ECEA;--muted:#93A09B;--accent:#5EBB9F;--accent-fg:#0E1412;--line:#2E3834;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"Hiragino Sans",sans-serif;padding:32px max(16px,env(safe-area-inset-left))}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;margin:0} .v{color:var(--muted);font-size:14px}
a.btn{display:inline-block;background:var(--accent);color:var(--accent-fg);text-decoration:none;font-weight:700;padding:12px 20px;border-radius:12px;text-align:center}
pre{white-space:pre-wrap;font:14px/1.7 inherit;border:1px solid var(--line);border-radius:12px;padding:12px;margin:0}
</style></head>
<body><main>
<h1>サムネブックマーク</h1>
<div class="v">v0.10.1（Orion 用）</div>
<a class="btn" href="orion/thumbmarks-v0.10.1.xpi">インストール</a>
<pre>- 画面を隠す方式を変更：ページに覆いをかぶせるのではなく、アプリが背面に行った瞬間にそのタブを中立なページ（サムネブックマークのロゴとドメイン名、続ける／新しいタブ／一覧）に移す。あとで Orion を開いても、タブを復元しても、見えるのはこの中立なページ。「続ける」で元のページに戻る（スクロール位置も戻す）
- ブラウザ内のタブ切り替えでは動かない。起動判定（前回のループの原因）はやめた
- App スイッチャーに写る画面は iOS が撮るもので、拡張機能からは隠せない（Orion 側に要望が出ている）</pre>
</main></body></html>
