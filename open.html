<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>サムネブックマーク</title>
<style>
:root{--bg:#EEF0EC;--fg:#1C2220;--muted:#68726E;--accent:#1F6B57;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141917;--fg:#E8ECEA;--muted:#93A09B;--accent:#5EBB9F;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"Hiragino Sans",sans-serif;display:grid;place-items:center;min-height:100vh}
main{text-align:center;padding:24px;display:flex;flex-direction:column;gap:12px;align-items:center}
.sp{width:28px;height:28px;border:3px solid var(--muted);border-top-color:var(--accent);border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
a{color:var(--accent)} .alt{display:none;color:var(--muted);font-size:14px}
</style></head>
<body><main>
<div class="sp" id="sp"></div>
<div id="t">一覧を開いています…</div>
<div class="alt" id="alt">開かない場合は、Orion で開いているか、拡張機能が入っているかを確認してください。<br><a href="./">インストールはこちら</a></div>
<script>setTimeout(function(){if(document.documentElement.hasAttribute("data-tm-refused"))return;document.getElementById("alt").style.display="block";document.getElementById("sp").style.display="none";document.getElementById("t").textContent="";},2500);</script>
</main></body></html>
